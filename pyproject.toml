[project]
name = "stock-prediction"
version = "0.1.0"
description = "自选股票股价走势预测、回测和风控工具"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.0",
    "akshare>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "pyarrow>=12.0.0",
]

[project.optional-dependencies]
all = ["xgboost", "torch"]

[project.scripts]
stock = "src.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
